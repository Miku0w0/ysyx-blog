<div id="particles-js" style="position: absolute; width: 100%; height: 100%; background-color: #ffffff;"></div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>
        window.onload = function () {
                if (typeof particlesJS === "undefined") {
                        console.error("[ERROR] particlesJS 库未加载！");
                        return;
                }

                particlesJS("particles-js", {
                        "particles": {
                                // --- 密度调整 ---
                                "number": {
                                        "value": 150, // 数量从 80 增加到 150
                                        "density": { "enable": true, "value_area": 800 }
                                },
                                // --- 颜色调整：深蓝色 ---
                                "color": { "value": "#007acc" },
                                "shape": { "type": "circle" },
                                "opacity": {
                                        "value": 0.6,
                                        "random": true // 开启随机透明度，增加层次感
                                },
                                "size": {
                                        "value": 3,
                                        "random": true
                                },
                                "line_linked": {
                                        "enable": true,
                                        "distance": 130, // 缩短连线距离，让网络看起来更紧密
                                        "color": "#007acc", // 线条颜色同步
                                        "opacity": 0.3,
                                        "width": 1
                                },
                                "move": {
                                        "enable": true,
                                        "speed": 1.8, // 稍微降低速度，粒子多的时候慢一点更好看
                                        "direction": "none",
                                        "random": true,
                                        "out_mode": "out",
                                        "bounce": false
                                }
                        },
                        "interactivity": {
                                "detect_on": "window", // 确保全窗口鼠标感应
                                "events": {
                                        "onhover": {
                                                "enable": true,
                                                "mode": "grab" // 换成了 grab（吸附连线），粒子多的时候这个效果非常惊艳
                                        },
                                        "onclick": {
                                                "enable": true,
                                                "mode": "push"
                                        },
                                        "resize": true
                                },
                                "modes": {
                                        "grab": {
                                                "distance": 200,
                                                "line_linked": { "opacity": 1 }
                                        },
                                        "push": { "particles_nb": 4 }
                                }
                        },
                        "retina_detect": true
                });
                console.log("[SUCCESS] 高密度蓝色主题已加载");
        };
</script>
